
<div class="list-page">
  <div class="buscador">
    <p class="titulo">Buscar SuperHeroe:</p>
    <form class="example-form" (keydown)="preventDefault($event)">
      <mat-form-field class="form-field">
        <input matInput
          (input)="searchHero()"
          type="text"
          [formControl]="searchControl">
        </mat-form-field>
      </form>
    </div>
  <mat-divider></mat-divider>

  <div class="content-area">
    @if (!isLoading) {
      <div class="container" #content>
        @if (heroes.length === 0 && searchControl.value && searchControl.value.length > 0) {
          <h1>No hay resultados para tu busqueda: {{searchControl.value}}</h1>
        }
        @for (hero of heroes; track hero) {
          <div>
            <app-hero-card [hero]="hero"
              (delete)="onDeleteHero($event)">
            </app-hero-card>
          </div>
        }
      </div>
    } @else {
      <div class="loader">
        <mat-spinner>
        </mat-spinner>
      </div>
    }
  </div>

  @if (!searchControl.value) {
    <mat-paginator [length]="totalHeroes"
      [pageSize]="4"
      [pageSizeOptions]="[4,8,10]"
      (page)="onPageChange($event)"
      aria-label="Select page">
    </mat-paginator>
  }
</div>
